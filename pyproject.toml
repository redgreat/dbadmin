[tool.poetry]
name = "数据运维"
version = "0.1.0"
description = "数据库管理后台系统"
authors = ["wangcw <rubygreat@msn.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.139.0"
tortoise-orm = "^0.20.1"
pydantic = "^2.7.1"
email-validator = "^2.0.0.post2"
passlib = "^1.7.4"
pyjwt = "^2.7.0"
black = "^23.7.0"
isort = "^5.12.0"
ruff = "^0.16.0"
loguru = "^0.7.0"
pydantic-settings = "^2.0.3"
argon2-cffi = "^23.1.0"
pydantic-core = "^2.18.2"
annotated-types = "^0.6.0"
setuptools = "^70.0.0"
uvicorn = "0.31.1"
h11 = "^0.14.0"
aerich = "^0.7.2"
asyncpg = "^0.29.0"
aiomysql = "^0.2.0"
aioodbc = "^0.4.0"
requests = "^2.32.3"
apscheduler = "^3.11.0"
cryptography = "^45.0.3"
pytz = "^2025.2"
openpyxl = "^3.1.2"
pyyaml = "^6.0"
sqlparse = "^0.5.0"
pypinyin = "^0.53.0"
celery = {extras = ["redis"], version = "^5.4.0"}
oss2 = "^2.19.1"
openai = "^2.45.0"
mcp = "^1.28.1"
httpx = "^0.28.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"

[tool.ruff]
line-length = 120
target-version = "py312"

# 启用 lint 检查（只保留 import 排序，其它规则全部关闭，避免新版 ruff 爆量告警）
[tool.ruff.lint]
select = ["I"]  # 只启用 isort，其他默认规则全部不启用

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.aerich]
tortoise_orm = "app.settings.TORTOISE_ORM"
location = "./migrations"
src_folder = "./."
