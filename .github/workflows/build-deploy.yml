name: Docker Image CI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:


jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Tencent Cloud Container Registry
        # 腾讯云个人版 TCR，国内部署拉取快
        uses: docker/login-action@v3
        with:
          registry: ccr.ccs.tencentyun.com
          username: ${{ secrets.TENCENT_USERNAME }}
          password: ${{ secrets.TENCENT_PASSWORD }}

      - name: Build and push to GHCR
        # 主发布：先推 GHCR，不依赖腾讯云，保证 Release 永远成功
        uses: nick-fields/retry@v2
        with:
          max_attempts: 3
          retry_wait_seconds: 10
          timeout_minutes: 30
          command: |
            REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
            docker buildx build --push --platform linux/amd64 \
              -t "ghcr.io/${REPO_LOWER}:${{ github.ref_name }}" \
              -t "ghcr.io/${REPO_LOWER}:latest" \
              .

      - name: Copy image to Tencent TCR (国内镜像，失败不阻塞发布)
        # 不重新构建：把 GHCR 上刚推的镜像 registry 间复制到 TCR；
        # 跨境链路不稳，重试 5 次；仍失败只标黄该步骤，不影响 GHCR 版本
        continue-on-error: true
        uses: nick-fields/retry@v2
        with:
          max_attempts: 5
          retry_wait_seconds: 15
          timeout_minutes: 40
          command: |
            REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
            docker buildx imagetools create \
              -t "ccr.ccs.tencentyun.com/${{ secrets.TENCENT_NAMESPACE }}/${{ secrets.DOCKER_IMAGE_NAME }}:${{ github.ref_name }}" \
              -t "ccr.ccs.tencentyun.com/${{ secrets.TENCENT_NAMESPACE }}/${{ secrets.DOCKER_IMAGE_NAME }}:latest" \
              "ghcr.io/${REPO_LOWER}:${{ github.ref_name }}"
