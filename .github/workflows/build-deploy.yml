name: Docker Image CI

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Log in to Tencent Cloud Container Registry
        # 腾讯云个人版 TCR；偶发 connection reset 时用 retry 重试
        uses: nick-fields/retry@v2
        with:
          attempts: 3
          delay: 5
          timeout_minutes: 3
          command: sh -c 'echo "${{ secrets.TENCENT_PASSWORD }}" | docker login ccr.ccs.tencentyun.com -u "${{ secrets.TENCENT_USERNAME }}" --password-stdin'

      - name: Build and push to GHCR + Tencent (multi-arch OCI)
        # 一次 buildx 同时推 GHCR 与腾讯云（namespace/仓名走 secrets）；
        # 仅 amd64（只部署 x86，避开多架构 OCI 的兼容坑，更快更稳）
        uses: nick-fields/retry@v2
        with:
          attempts: 3
          delay: 10
          timeout_minutes: 30
          command: |
            sh -c "docker buildx build --push --platform linux/amd64 \
              -t "ghcr.io/${{ toLower(github.repository) }}:${{ github.ref_name }}" \
              -t "ghcr.io/${{ toLower(github.repository) }}:latest" \
              -t "ccr.ccs.tencentyun.com/${{ secrets.TENCENT_NAMESPACE }}/${{ secrets.DOCKER_IMAGE_NAME }}:${{ github.ref_name }}" \
              -t "ccr.ccs.tencentyun.com/${{ secrets.TENCENT_NAMESPACE }}/${{ secrets.DOCKER_IMAGE_NAME }}:latest" ."
