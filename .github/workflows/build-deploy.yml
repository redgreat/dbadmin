name: Docker Image CI

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Aliyun Container Registry
        # 跨洋链路偶发 connection reset，用 try 模式重试3次（间隔5s）
        uses: nick-fields/retry@v2
        with:
          attempts: 3
          delay: 5
          timeout_minutes: 3
          command: sh -c 'echo "${{ secrets.ALIYUN_PASSWORD }}" | docker login registry.cn-hangzhou.aliyuncs.com -u "${{ secrets.ALIYUN_USERNAME }}" --password-stdin'

      - name: Build and push
        # push 步骤同样偶发 reset，单独重试（登录成功后重试的是整个步骤，幂等安全）
        uses: nick-fields/retry@v2
        with:
          attempts: 3
          delay: 10
          timeout_minutes: 30
          command: sh -c 'docker buildx build --push -t "registry.cn-hangzhou.aliyuncs.com/${{ secrets.ALIYUN_NAMESPACE }}/${{ secrets.DOCKER_IMAGE_NAME }}:${{ github.ref_name }}" -t "registry.cn-hangzhou.aliyuncs.com/${{ secrets.ALIYUN_NAMESPACE }}/${{ secrets.DOCKER_IMAGE_NAME }}:latest" .'
