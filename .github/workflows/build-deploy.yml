name: Docker Image CI

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Log in to Tencent Cloud Container Registry
        uses: nick-fields/retry@v2
        with:
          attempts: 3
          delay: 5
          timeout_minutes: 3
          command: sh -c 'echo "${{ secrets.TENCENT_PASSWORD }}" | docker login ccr.ccs.tencentyun.com -u "${{ secrets.TENCENT_USERNAME }}" --password-stdin'

      - name: Build and push to GHCR + Tencent (multi-arch OCI)
        uses: nick-fields/retry@v2
        with:
          attempts: 3
          delay: 10
          timeout_minutes: 30
          command: |
            REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
            docker buildx build --push --platform linux/amd64 \
              -t "ghcr.io/${REPO_LOWER}:${{ github.ref_name }}" \
              -t "ghcr.io/${REPO_LOWER}:latest" \
              -t "ccr.ccs.tencentyun.com/${{ secrets.TENCENT_NAMESPACE }}/${{ secrets.DOCKER_IMAGE_NAME }}:${{ github.ref_name }}" \
              -t "ccr.ccs.tencentyun.com/${{ secrets.TENCENT_NAMESPACE }}/${{ secrets.DOCKER_IMAGE_NAME }}:latest" \
              .
